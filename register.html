    <div class="container py-5">
        <div class="row">
            <div class="col mx-auto " style="max-width: 420px;">
                <button class="btn btn-primary text-white mb-3">Go Back</button>
                <div class="card mx-auto shadow border-0 rounded-0">
                    <div>

                        <h3 class="mb-0 mx-auto text-center bg-dark w-100 py-4 text-white">Create
                            Account</h3>
                    </div>

                    <form class="px-4 py-5">

                        <div>
                            <label for="name" class="mb-2 mt-3 fw-bold">Full Name</label>
                            <input type="text" class="form-control rounded-0" placeholder="Enter your Name" name="name">
                        </div>

                        <div>
                            <label for="email" class="mb-2 mt-3 fw-bold">Email</label>
                            <input type="text" class="form-control rounded-0" placeholder="Enter your Email"
                                name="email">
                        </div>
                        <div>
                            <label for="address" class="mb-2 mt-3 fw-bold">Address</label>
                            <input type="text" class="form-control rounded-0" placeholder="Enter your Address"
                                name="address">
                        </div>
                        <div>
                            <label for="phone" class="mb-2 mt-3 fw-bold">Phone</label>
                            <input type="text" class="form-control rounded-0" placeholder="Enter your Phone"
                                name="phone">
                        </div>
                        <div>
                            <label for="password" class="mb-2 mt-3 fw-bold">Password</label>
                            <input type="password" class="form-control rounded-0" placeholder="Enter your Password"
                                name="password">
                        </div>
                        <div>
                            <label for="confirm-password" class="mb-2 mt-3 fw-bold">Confirm Password</label>
                            <input type="password" class="form-control rounded-0" placeholder="Confirm your Password"
                                name="confirm-password">
                        </div>

                        <div class="mt-4 mx-auto text-center">
                            <button class="btn btn-dark w-50 rounded-0">Register</button>
                        </div>

                        <p class="mt-4 mb-0 text-center">Already have an Account? <a href="login.html"
                                class="text-decoration-none">Login</a></p>

                    </form>

                </div>
            </div>
        </div>
    </div>
